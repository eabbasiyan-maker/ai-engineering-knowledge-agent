name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: ai-engineering-knowledge-agent-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Deploy website
        run: |
          npx wrangler pages deploy web \
            --project-name "$PAGES_PROJECT" \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "GitHub Actions deploy"

      - name: Verify website
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base = "https://ai-engineering-knowledge-agent-web.pages.dev";
          const cacheBust = encodeURIComponent(process.env.GITHUB_SHA || Date.now());
          const url = base + "/?deploy=" + cacheBust;
          const requiredMarkers = [
            "AI.Knowledge",
            "id=\"ask-form\"",
            "id=\"answer-section\"",
            "id=\"topics\"",
            "id=\"questions\"",
            "id=\"books\"",
            "name=\"app-version\" content=\"0.3.4\"",
            "hero-ai-knowledge.webp?v=0.3.4"
          ];
          let last = null;

          for (let attempt = 1; attempt <= 4; attempt++) {
            try {
              const res = await fetch(url, { cache: "no-store" });
              const html = await res.text();
              const missing = requiredMarkers.filter(marker => !html.includes(marker));

              if (res.ok && missing.length === 0) {
                console.log("Website OK:", url, "attempt", attempt);
                process.exit(0);
              }

              last = res.ok
                ? "missing markers: " + missing.join(", ")
                : "HTTP " + res.status;
            } catch (error) {
              last = String(error);
            }

            console.log("Waiting for Pages propagation:", attempt, last);
            if (attempt < 4) {
              await new Promise(resolve => setTimeout(resolve, 3000));
            }
          }

          throw new Error("website verification failed: " + last);
          NODE

      - name: Verify Worker public experience
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base = "https://ai-engineering-knowledge-agent.e-abbasiyan.workers.dev";
          const cacheBust = encodeURIComponent(process.env.GITHUB_SHA || Date.now());

          const homeRes = await fetch(base + "/?deploy=" + cacheBust, { cache: "no-store" });
          const homeHtml = await homeRes.text();
          const homeMarkers = [
            "AI.Knowledge",
            "id=\"ask-form\"",
            "id=\"answer-section\"",
            "id=\"topics\"",
            "id=\"questions\"",
            "id=\"books\"",
            "name=\"app-version\" content=\"0.3.4\"",
            "hero-ai-knowledge.webp?v=0.3.4",
            "href=\"/answer.css\"",
            "href=\"/discovery.css\"",
            "href=\"/library.css\""
          ];
          if (!homeRes.ok || homeMarkers.some(marker => !homeHtml.includes(marker))) {
            throw new Error("Worker homepage UI is stale or unavailable");
          }

          const heroRes = await fetch(base + "/hero-ai-knowledge.webp?deploy=" + cacheBust, { cache: "no-store" });
          const heroType = heroRes.headers.get("content-type") || "";
          if (!heroRes.ok || !heroType.includes("image/")) {
            throw new Error("Versioned hero asset is unavailable from Worker");
          }

          const cssRes = await fetch(base + "/styles.css?deploy=" + cacheBust, { cache: "no-store" });
          const css = await cssRes.text();
          if (!cssRes.ok || !css.includes("color-scheme: light") || !css.includes("@media (max-width: 720px)")) {
            throw new Error("Light/mobile stylesheet verification failed");
          }

          const modularStyles = [
            ["/answer.css", "Answer experience"],
            ["/discovery.css", "Knowledge Discovery"],
            ["/library.css", "Library experience"]
          ];
          for (const [path, marker] of modularStyles) {
            const res = await fetch(base + path + "?deploy=" + cacheBust, { cache: "no-store" });
            const text = await res.text();
            if (!res.ok || !text.includes(marker)) {
              throw new Error("Worker modular stylesheet missing: " + path);
            }
          }

          const publicRes = await fetch(base + "/api/v1/home", { cache: "no-store" });
          const publicHome = await publicRes.json();
          if (!publicRes.ok) throw new Error("/api/v1/home failed");
          if (!(Number(publicHome?.library?.active_books) > 0)) throw new Error("active_books missing");
          if (!(Number(publicHome?.library?.active_chunks) > 0)) throw new Error("active_chunks missing");
          if (!Array.isArray(publicHome?.frequent_questions) || publicHome.frequent_questions.length === 0) {
            throw new Error("frequent questions missing");
          }
          if (!Array.isArray(publicHome?.recent_questions) || publicHome.recent_questions.length === 0) {
            throw new Error("recent questions missing");
          }

          const askRes = await fetch(base + "/api/v1/ask", {
            method: "POST",
            headers: {
              "content-type": "application/json",
              "x-agent-traffic": "automated_test"
            },
            body: JSON.stringify({
              question: "RAG چیست و چه زمانی از آن استفاده می‌کنیم؟",
              channel: "web",
              top_k: 8
            })
          });
          const answer = await askRes.json();
          if (!askRes.ok || !answer?.answer || !answer?.request_id) {
            throw new Error("website ask flow failed");
          }
          if (!Array.isArray(answer?.sources) || answer.sources.length === 0) {
            throw new Error("website answer returned no sources");
          }
          if (!answer?.evidence_status) throw new Error("evidence status missing");

          console.log(JSON.stringify({
            homepage: "ok",
            mobile_css: "ok",
            modular_css: "ok",
            active_books: publicHome.library.active_books,
            active_chunks: publicHome.library.active_chunks,
            frequent_questions: publicHome.frequent_questions.length,
            recent_questions: publicHome.recent_questions.length,
            ask: "ok",
            evidence_status: answer.evidence_status,
            sources: answer.sources.length
          }, null, 2));
          NODE

      - name: Verify mobile admin and ingestion tools
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base = "https://ai-engineering-knowledge-agent-web.pages.dev";
          const checks = [
            [base + "/admin.html", "AGENT HEALTH & USAGE"],
            [base + "/ingest.html", "MOBILE INGESTION"],
            [base + "/ingest-app.js", "completeVersion"],
            [base + "/ingest-pdf.js", "pdfjs-dist"],
            [base + "/ingest-epub.js", "fflate"]
          ];

          for (const [url, marker] of checks) {
            let ok = false;
            let last = "";
            for (let attempt = 1; attempt <= 8; attempt++) {
              try {
                const res = await fetch(url);
                const text = await res.text();
                if (res.ok && text.includes(marker)) {
                  ok = true;
                  break;
                }
                last = "HTTP " + res.status;
              } catch (error) {
                last = String(error);
              }
              await new Promise(resolve => setTimeout(resolve, 3000));
            }
            if (!ok) throw new Error("verification failed for " + url + ": " + last);
            console.log("OK", url);
          }
          NODE

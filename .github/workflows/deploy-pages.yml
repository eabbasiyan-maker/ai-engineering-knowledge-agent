name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: ai-engineering-knowledge-agent-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Deploy website
        run: |
          npx wrangler pages deploy web             --project-name "$PAGES_PROJECT"             --branch main             --commit-hash "$GITHUB_SHA"             --commit-message "GitHub Actions deploy"

      - name: Verify website
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url = "https://ai-engineering-knowledge-agent-web.pages.dev";
          let last = null;

          for (let attempt = 1; attempt <= 12; attempt++) {
            try {
              const res = await fetch(url);
              const html = await res.text();
              if (res.ok && html.includes("AI Engineering Knowledge Agent")) {
                console.log("Website OK:", url, "attempt", attempt);
                process.exit(0);
              }
              last = "HTTP " + res.status;
            } catch (error) {
              last = String(error);
            }

            console.log("Waiting for Pages propagation:", attempt, last);
            await new Promise(resolve => setTimeout(resolve, 5000));
          }

          throw new Error("website verification failed after retries: " + last);
          NODE

      - name: Verify mobile admin and ingestion tools
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base = "https://ai-engineering-knowledge-agent-web.pages.dev";
          const checks = [
            [base + "/admin.html", "AGENT HEALTH & USAGE"],
            [base + "/ingest.html", "MOBILE INGESTION"],
            [base + "/ingest-app.js", "completeVersion"],
            [base + "/ingest-pdf.js", "pdfjs-dist"],
            [base + "/ingest-epub.js", "fflate"]
          ];

          for (const [url, marker] of checks) {
            let ok = false;
            let last = "";
            for (let attempt = 1; attempt <= 8; attempt++) {
              try {
                const res = await fetch(url);
                const text = await res.text();
                if (res.ok && text.includes(marker)) {
                  ok = true;
                  break;
                }
                last = "HTTP " + res.status;
              } catch (error) {
                last = String(error);
              }
              await new Promise(resolve => setTimeout(resolve, 3000));
            }
            if (!ok) throw new Error("verification failed for " + url + ": " + last);
            console.log("OK", url);
          }
          NODE

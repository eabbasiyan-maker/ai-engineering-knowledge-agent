name: Evaluation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "eval/**"
      - "src/**"
      - "scripts/eval-live.mjs"
      - ".github/workflows/evaluation.yml"
      - "package.json"

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run eval:live

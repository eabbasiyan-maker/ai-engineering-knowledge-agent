# deploy-trigger: secrets-configured
name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Check Cloudflare credentials
        id: cf
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare deploy skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions secrets."
          fi

      - name: Resolve D1 database id
        if: steps.cf.outputs.ready == 'true'
        id: d1
        shell: bash
        run: |
          D1_ID="$(npx wrangler d1 list --json | node -e '
            let s="";
            process.stdin.on("data", d => s += d);
            process.stdin.on("end", () => {
              const rows = JSON.parse(s);
              const db = rows.find(x => x.name === "ai-knowledge-catalog");
              if (!db) {
                console.error("D1 database ai-knowledge-catalog not found");
                process.exit(2);
              }
              const id = db.uuid || db.id || db.database_id;
              if (!id) {
                console.error("D1 database id missing from wrangler output");
                process.exit(3);
              }
              process.stdout.write(id);
            });
          ')"
          echo "database_id=$D1_ID" >> "$GITHUB_OUTPUT"

      - name: Generate deploy config
        if: steps.cf.outputs.ready == 'true'
        shell: bash
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          cat > wrangler.deploy.jsonc <<EOF
          {
            "name": "ai-engineering-knowledge-agent",
            "main": "src/index.ts",
            "compatibility_date": "2026-09-14",
            "workers_dev": true,
            "vars": {
              "EMBEDDING_MODEL": "@cf/baai/bge-m3"
            },
            "d1_databases": [
              {
                "binding": "DB",
                "database_name": "ai-knowledge-catalog",
                "database_id": "$D1_DATABASE_ID"
              }
            ],
            "vectorize": [
              {
                "binding": "VECTORIZE",
                "index_name": "ai-knowledge-index"
              }
            ],
            "ai": {
              "binding": "AI"
            }
          }
          EOF

      - name: Deploy Worker
        if: steps.cf.outputs.ready == 'true'
        run: npx wrangler deploy --config wrangler.deploy.jsonc


      - name: Smoke test supported answer
        if: steps.cf.outputs.ready == 'true'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url = "https://ai-engineering-knowledge-agent.e-abbasiyan.workers.dev/api/v1/ask";
          const res = await fetch(url, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              question: "What are common ReAct failure modes and how can they be mitigated?",
              channel: "api",
              top_k: 8
            })
          });
          const text = await res.text();
          if (!res.ok) throw new Error("supported-answer HTTP " + res.status + ": " + text);
          const body = JSON.parse(text);
          if (!body.request_id) throw new Error("missing request_id");
          if (!body.answer) throw new Error("missing answer");
          if (!body.evidence_status) throw new Error("missing evidence_status");
          if (!body.confidence) throw new Error("missing confidence");
          if (!Array.isArray(body.sources) || body.sources.length === 0) throw new Error("missing sources");
          if (!body.sources.some(s => s.source_id === "BOOK-002")) throw new Error("BOOK-002 not cited");
          console.log(JSON.stringify({
            evidence_status: body.evidence_status,
            confidence: body.confidence,
            sources: body.sources.map(s => ({ id: s.id, source_id: s.source_id, chunk_id: s.chunk_id })),
            answer: body.answer
          }, null, 2));
          NODE

      - name: Smoke test no-evidence behavior
        if: steps.cf.outputs.ready == 'true'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url = "https://ai-engineering-knowledge-agent.e-abbasiyan.workers.dev/api/v1/ask";
          const res = await fetch(url, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              question: "What is the recommended orbital insertion burn for a crewed mission to Neptune?",
              channel: "api",
              top_k: 8
            })
          });
          const text = await res.text();
          if (!res.ok) throw new Error("no-evidence HTTP " + res.status + ": " + text);
          const body = JSON.parse(text);
          if (body.evidence_status !== "no_evidence") {
            throw new Error("expected no_evidence, got " + body.evidence_status);
          }
          if (!Array.isArray(body.sources) || body.sources.length !== 0) {
            throw new Error("no-evidence response should have zero sources");
          }
          console.log(JSON.stringify({
            evidence_status: body.evidence_status,
            confidence: body.confidence,
            answer: body.answer
          }, null, 2));
          NODE
